name: Beauty & Grooming Platform CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  verify-web:
    name: Verify Web Platform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails on critical advisories in shipped dependencies (the class that included the Next.js
      # middleware bypass). Remaining highs are Expo/React Native build tooling pinned by the Expo SDK
      # and a lint-only ReDoS in eslint-config-next; they are tracked in docs/reviews.
      - name: Reject critical dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Verify security-critical patterns
        run: npm run test:security-core

      - name: Verify admin control patterns
        run: npm run test:admin-controls

      - name: Database tests (migrations, RLS, server commands on PGlite)
        run: npm run test:db

      - name: Inventory and supply tests
        run: npm run test:inventory

      - name: Mobile unit tests (session storage)
        run: npm run test:mobile

      - name: Migration compatibility with the P3 branch
        run: npm run test:p3-compat

      - name: Web tests (authorization boundaries, no mock data)
        run: npm run test --workspace=web_platform

      - name: Lint web platform
        run: npm run lint --workspace=web_platform

      - name: Verify TypeScript compilation & Next.js Build
        run: npm run build --workspace=web_platform
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiJ9.placeholder

  verify-mobile:
    name: Verify Mobile App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript validation (mobile_app)
        run: npm run typecheck:mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiJ9.placeholder

      - name: Lint mobile app
        run: npm run lint --workspace=mobile_app

  verify-supabase:
    name: Verify Database & Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations and seed on the real Postgres
        run: supabase db reset

      - name: Smoke test the real stack (sign-in, row-level security, privileges, booking)
        run: node scripts/smoke-local-supabase.mjs

      - name: Verify DB Migration Integrity
        run: supabase db lint

      - name: Verify Deno Edge Functions
        run: |
          deno lint supabase/functions
          for f in supabase/functions/*/index.ts; do
            deno check "$f"
          done
