": "state", "name": "Notifications — loading", "parent": "shared-drawer-notifications", "state_variant": "loading", "area": ""}, {"id": "shared-command-palette-global-search", "kind": "command-palette", "name": "Search", "area": "", "shared": true, "provenance": ["closure:depth-1:from:shell::global-search"]}, {"id": "shared-command-palette-global-search-state-no-results", "kind": "state", "name": "Search — no-results", "parent": "shared-command-palette-global-search", "state_variant": "no-results", "area": ""}, {"id": "shared-toast-success", "kind": "toast", "name": "Mark all read", "area": "", "shared": true, "provenance": ["closure:depth-2:from:shared-drawer-notifications::nt-markall"]}, {"id": "shared-toast-error", "kind": "toast", "name": "Error", "area": "", "shared": true, "provenance": ["closure:depth-3:from:settings::toast:error"]}, {"id": "shared-modal-reauthenticate", "kind": "modal", "name": "Confirm password", "area": "", "shared": true, "provenance": ["closure:depth-3:from:settings::reauth"]}, {"id": "shared-toast-info", "kind": "toast", "name": "Undo", "area": "", "shared": true, "provenance": ["closure:depth-3:from:shared-toast-success::undo"]}], "edges": [{"source": "local-booking-and-support-pilot", "target": "local-booking-and-support-pilot-popover-date-range", "type": "contains"}, {"source": "local-booking-and-support-pilot", "target": "local-booking-and-support-pilot-popover-widget-actions", "type": "contains"}, {"source": "local-booking-and-support-pilot", "target": "local-booking-and-support-pilot-state-loading", "type": "contains"}, {"source": "local-booking-and-support-pilot", "target": "local-booking-and-support-pilot-state-error", "type": "contains"}, {"source": "local-booking-and-support-pilot", "target": "local-booking-and-support-pilot-state-empty", "type": "contains"}, {"source": "profile", "target": "profile-popover-date-range", "type": "contains"}, {"source": "profile", "target": "profile-popover-widget-actions", "type": "contains"}, {"source": "settings", "target": "settings-modal-destructive-confirm", "type": "contains"}, {"source": "settings-notifications", "target": "settings-notifications-modal-destructive-confirm", "type": "contains"}, {"source": "local-booking-and-support-pilot-popover-date-range", "target": "local-booking-and-support-pilot", "type": "opens_from"}, {"source": "local-booking-and-support-pilot-popover-widget-actions", "target": "local-booking-and-support-pilot", "type": "opens_from"}, {"source": "profile-popover-date-range", "target": "profile", "type": "opens_from"}, {"source": "profile-popover-widget-actions", "target": "profile", "type": "opens_from"}, {"source": "settings-modal-destructive-confirm", "target": "settings", "type": "opens_from"}, {"source": "settings-notifications-modal-destructive-confirm", "target": "settings-notifications", "type": "opens_from"}], "totals": {"nodes": 23, "edges": 15, "by_node_kind": {"page": 4, "popover": 5, "state": 6, "modal": 3, "drawer": 1, "command-palette": 1, "toast": 3}, "by_edge_type": {"contains": 9, "opens_from": 6}}};

// Node styling per kind
const KIND_STYLE = {
  page:    { color: '#06b6d4', shape: 'round-rectangle', width: 120, height: 40 },
  modal:   { color: '#f59e0b', shape: 'rectangle',       width:  90, height: 30 },
  drawer:  { color: '#eab308', shape: 'round-rectangle', width:  90, height: 30 },
  popover: { color: '#a855f7', shape: 'round-rectangle', width:  80, height: 28 },
  state:   { color: '#22c55e', shape: 'diamond',         width:  70, height: 40 },
  role:    { color: '#ef4444', shape: 'ellipse',         width:  80, height: 30 },
  story:   { color: '#8b5cf6', shape: 'tag',             width: 100, height: 30 },
};

// Edge styling per type
const EDGE_STYLE = {
  contains:             { color: '#475569', width: 1, style: 'dashed',  arrow: 'triangle' },
  opens_from:           { color: '#64748b', width: 1, style: 'dotted',  arrow: 'triangle' },
  navigates_to:         { color: '#06b6d4', width: 2, style: 'solid',   arrow: 'triangle' },
  flow_next:            { color: '#f59e0b', width: 3, style: 'solid',   arrow: 'triangle' },
  role_gate:            { color: '#ef4444', width: 1, style: 'dashed',  arrow: 'none' },
  referenced_in_story:  { color: '#8b5cf6', width: 1, style: 'dotted',  arrow: 'none' },
  shares_state_with:    { color: '#64748b', width: 1, style: 'dashed',  arrow: 'none' },
};

// Build Cytoscape elements
const elements = [];
GRAPH_DATA.nodes.forEach(n => {
  elements.push({
    data: { ...n, label: n.name || n.id },
    classes: `kind-${n.kind} area-${(n.area || 'none')}`,
  });
});
GRAPH_DATA.edges.forEach((e, i) => {
  elements.push({
    data: { id: `e${i}`, source: e.source, target: e.target, type: e.type, annotation: e.annotation || '' },
    classes: `edge-type-${e.type}`,
  });
});

// Offline guard: planning works offline; the interactive layout needs the
// Cytoscape CDN. Degrade to a complete static inventory instead of a blank page.
if (typeof cytoscape === 'undefined') {
  const host = document.getElementById('cy');
  const note = document.createElement('div');
  note.style.cssText = 'padding:12px 16px;color:#fbbf24;font-size:12px;border-bottom:1px solid #334155';
  note.textContent = 'Offline — the interactive map needs the Cytoscape CDN. Full inventory below; the diagram also ships as plan.mermaid.';
  const list = document.createElement('div');
  list.style.cssText = 'overflow-y:auto;position:absolute;top:41px;bottom:0;left:0;right:0;padding:12px';
  const byArea = {};
  GRAPH_DATA.nodes.forEach(n => { const a = n.area || '—'; (byArea[a] = byArea[a] || []).push(n); });
  Object.keys(byArea).sort().forEach(area => {
    const h = document.createElement('div');
    h.style.cssText = 'margin:12px 0 4px;font-size:11px;text-transform:uppercase;color:#94a3b8';
    h.textContent = area;
    list.appendChild(h);
    byArea[area].forEach(n => {
      const row = document.createElement('div');
      row.style.cssText = 'padding:3px 0;font-size:12px;color:#e2e8f0';
      row.textContent = '[' + n.kind + '] ' + (n.name || n.id) + (n.route ? ' — ' + n.route : '');
      list.appendChild(row);
    });
  });
  host.appendChild(note);
  host.appendChild(list);
} else {

// Initialize Cytoscape
const cy = cytoscape({
  container: document.getElementById('cy'),
  elements,
  style: [
    { selector: 'node', style: {
        'background-color': n => KIND_STYLE[n.data('kind')]?.color || '#64748b',
        'shape': n => KIND_STYLE[n.data('kind')]?.shape || 'ellipse',
        'width': n => KIND_STYLE[n.data('kind')]?.width || 80,
        'height': n => KIND_STYLE[n.data('kind')]?.height || 30,
        'label': 'data(label)',
        'text-valign': 'center',
        'text-halign': 'center',
        'font-size': '9px',
        'color': '#fff',
        'text-outline-color': '#0f172a',
        'text-outline-width': 2,
        'text-wrap': 'ellipsis',
        'text-max-width': n => (KIND_STYLE[n.data('kind')]?.width || 80) - 10,
        'border-width': 1,
        'border-color': '#0f172a',
      } },
    { selector: 'node:selected', style: {
        'border-width': 3,
        'border-color': '#fbbf24',
      } },
    { selector: 'node.highlighted', style: {
        'border-width': 3,
        'border-color': '#fbbf24',
      } },
    { selector: 'node.dimmed', style: {
        'opacity': 0.2,
      } },
    { selector: 'edge', style: {
        'width': e => EDGE_STYLE[e.data('type')]?.width || 1,
        'line-color': e => EDGE_STYLE[e.data('type')]?.color || '#475569',
        'line-style': e => EDGE_STYLE[e.data('type')]?.style || 'solid',
        'target-arrow-color': e => EDGE_STYLE[e.data('type')]?.color || '#475569',
        'target-arrow-shape': e => EDGE_STYLE[e.data('type')]?.arrow || 'triangle',
        'curve-style': 'bezier',
        'opacity': 0.7,
        'label': 'data(annotation)',
        'font-size': '8px',
        'color': '#94a3b8',
        'text-background-color': '#0f172a',
        'text-background-opacity': 1,
        'text-background-padding': 2,
      } },
    { selector: 'edge.dimmed', style: {
        'opacity': 0.1,
      } },
    { selector: 'edge.highlighted', style: {
        'opacity': 1,
        'width': e => (EDGE_STYLE[e.data('type')]?.width || 1) + 1,
      } },
  ],
  layout: { name: 'cose-bilkent', nodeDimensionsIncludeLabels: true, idealEdgeLength: 80, nodeRepulsion: 8000, animate: false },
  minZoom: 0.1,
  maxZoom: 3,
  wheelSensitivity: 0.2,
});

// Stats bar
const stats = document.getElementById('stats');
function updateStats() {
  const visible = cy.elements(':visible').length;
  const total = cy.elements().length;
  stats.textContent = `${visible} / ${total} elements visible`;
}
updateStats();

// Totals in sidebar
const totalsDisplay = document.getElementById('totals-display');
const t = GRAPH_DATA.totals;
totalsDisplay.innerHTML = `
  Nodes: ${t.nodes}<br>
  Edges: ${t.edges}<br>
  <br>
  <span style="color:#64748b">Areas:</span> ${GRAPH_DATA.areas.join(', ') || '—'}
`;

// Build filter UI
function buildFilters() {
  // Area filters
  const areas = [...new Set(GRAPH_DATA.nodes.map(n => n.area).filter(a => a))].sort();
  const areaContainer = document.getElementById('area-filters');
  areas.forEach(area => {
    const count = GRAPH_DATA.nodes.filter(n => n.area === area).length;
    const label = document.createElement('label');
    label.className = 'toggle';
    label.innerHTML = `<input type="checkbox" checked data-area="${area}"> ${area} <span class="count">${count}</span>`;
    label.querySelector('input').addEventListener('change', applyFilters);
    areaContainer.appendChild(label);
  });

  // Kind filters
  const kindContainer = document.getElementById('kind-filters');
  const kinds = Object.keys(t.by_node_kind);
  kinds.forEach(kind => {
    const count = t.by_node_kind[kind];
    const color = KIND_STYLE[kind]?.color || '#64748b';
    const label = document.createElement('label');
    label.className = 'toggle';
    label.innerHTML = `<input type="checkbox" checked data-kind="${kind}"><span class="swatch" style="background:${color}"></span> ${kind} <span class="count">${count}</span>`;
    label.querySelector('input').addEventListener('change', applyFilters);
    kindContainer.appendChild(label);
  });

  // Edge type filters
  const edgeContainer = document.getElementById('edge-filters');
  const edgeTypes = Object.keys(t.by_edge_type);
  edgeTypes.forEach(et => {
    const count = t.by_edge_type[et];
    const color = EDGE_STYLE[et]?.color || '#64748b';
    const label = document.createElement('label');
    label.className = 'toggle';
    // Default: hide opens_from (always redundant with contains)
    const defaultChecked = (et !== 'opens_from') ? 'checked' : '';
    label.innerHTML = `<input type="checkbox" ${defaultChecked} data-edge="${et}"><span class="swatch" style="background:${color}"></span> ${et.replace(/_/g, ' ')} <span class="count">${count}</span>`;
    label.querySelector('input').addEventListener('change', applyFilters);
    edgeContainer.appendChild(label);
  });

  applyFilters();
}

function applyFilters() {
  const activeAreas = [...document.querySelectorAll('[data-area]:checked')].map(i => i.dataset.area);
  const activeKinds = [...document.querySelectorAll('[data-kind]:checked')].map(i => i.dataset.kind);
  const activeEdges = [...document.querySelectorAll('[data-edge]:checked')].map(i => i.dataset.edge);

  cy.batch(() => {
    cy.nodes().forEach(n => {
      const d = n.data();
      const areaOk = !d.area || activeAreas.includes(d.area);
      const kindOk = activeKinds.includes(d.kind);
      n.style('display', (areaOk && kindOk) ? 'element' : 'none');
    });
    cy.edges().forEach(e => {
      const typeOk = activeEdges.includes(e.data('type'));
      const endpointsVisible = e.source().style('display') !== 'none' && e.target().style('display') !== 'none';
      e.style('display', (typeOk && endpointsVisible) ? 'element' : 'none');
    });
  });
  updateStats();
}

// Search
const search = document.getElementById('search');
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  if (!q) {
    cy.elements().removeClass('dimmed highlighted');
    return;
  }
  const matched = cy.nodes().filter(n => {
    const d = n.data();
    return (d.label || '').toLowerCase().includes(q)
        || (d.id || '').toLowerCase().includes(q)
        || (d.route || '').toLowerCase().includes(q);
  });
  cy.elements().addClass('dimmed').removeClass('highlighted');
  matched.removeClass('dimmed').addClass('highlighted');
  matched.connectedEdges().removeClass('dimmed');
  matched.neighborhood().removeClass('dimmed');
  if (matched.length === 1) {
    cy.animate({ center: { eles: matched }, zoom: 1.5 }, { duration: 300 });
  } else if (matched.length > 1) {
    cy.fit(matched, 50);
  }
});

// Detail panel
const detailPanel = document.getElementById('detail-panel');
const detailContent = document.getElementById('detail-content');
function showDetail(node) {
  const d = node.data();
  const neighbors = node.neighborhood('node');
  const incoming = node.incomers('edge');
  const outgoing = node.outgoers('edge');

  let html = `<h3>${d.label || d.id}</h3>`;
  if (d.route) html += `<div class="route">${d.route}</div>`;

  if (d.purpose) html += `<div class="section"><div class="label">Purpose</div><div class="value">${d.purpose}</div></div>`;
  if (d.kind) html += `<div class="section"><div class="label">Kind</div><div class="value">${d.kind}${d.page_kind ? ` (${d.page_kind})` : ''}</div></div>`;
  if (d.area) html += `<div class="section"><div class="label">Area</div><div class="value">${d.area}</div></div>`;
  if (d.role_gated?.length) html += `<div class="section"><div class="label">Role-gated</div><div class="value">${d.role_gated.map(r => `<span class="tag">${r}</span>`).join('')}</div></div>`;
  if (d.provenance?.length) html += `<div class="section"><div class="label">Provenance</div><div class="value">${d.provenance.map(p => `<span class="tag">${p}</span>`).join('')}</div></div>`;

  if (outgoing.length) {
    html += `<div class="section"><div class="label">Outgoing (${outgoing.length})</div>`;
    outgoing.forEach(e => {
      const target = e.target();
      html += `<a class="neighbor" onclick="focusNode('${target.id()}')"><strong>${e.data('type')}</strong> → ${target.data('label') || target.id()}</a>`;
    });
    html += `</div>`;
  }
  if (incoming.length) {
    html += `<div class="section"><div class="label">Incoming (${incoming.length})</div>`;
    incoming.forEach(e => {
      const source = e.source();
      html += `<a class="neighbor" onclick="focusNode('${source.id()}')"><strong>${e.data('type')}</strong> ← ${source.data('label') || source.id()}</a>`;
    });
    html += `</div>`;
  }

  detailContent.innerHTML = html;
  detailPanel.classList.add('open');
}

function closeDetail() { detailPanel.classList.remove('open'); }

function focusNode(id) {
  const n = cy.$id(id);
  if (n.length) {
    cy.animate({ center: { eles: n }, zoom: 1.5 }, { duration: 300 });
    showDetail(n);
  }
}

cy.on('tap', 'node', evt => showDetail(evt.target));
cy.on('tap', evt => { if (evt.target === cy) closeDetail(); });

function setLayout(name) {
  const opts = { name, animate: true, animationDuration: 500 };
  if (name === 'cose-bilkent') {
    opts.nodeDimensionsIncludeLabels = true;
    opts.idealEdgeLength = 80;
    opts.nodeRepulsion = 8000;
  }
  if (name === 'concentric') {
    opts.concentric = n => n.data('kind') === 'page' ? 3 : (n.data('kind') === 'role' ? 1 : 2);
    opts.levelWidth = () => 1;
  }
  cy.layout(opts).run();
}

function fitAll() { cy.fit(undefined, 50); }

buildFilters();
window.focusNode = focusNode;
window.closeDetail = closeDetail;
window.setLayout = setLayout;
window.fitAll = fitAll;
</script>
</body>
</html>
